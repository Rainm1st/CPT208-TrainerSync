<!DOCTYPE html>
<html lang="en" data-theme="dark">

  <head>
    <script>
      if (['localhost', '127.0.0.1'].includes(location.hostname)) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            Promise.all(registrations.map((registration) => registration.unregister())).then(() => {
              if (window.caches) caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
            })
          })
        }
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TrainerSync</title>


    <!-- Theme: apply before paint to avoid flash -->
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark')</script>

    <meta name="theme-color" content="#060d1b" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />

    <!-- iOS PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TrainerSync" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
